<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <!-- Soft light-red ambient background glow aura -->
    <radialGradient id="redGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF3D00" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FF1E00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0404" stop-opacity="0" />
    </radialGradient>

    <!-- Gentle bloom glow filter for text -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&amp;display=swap');

      /* Base Typography */
      .headline {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        font-size: 66px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .subtitle {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-anchor: middle;
        dominant-baseline: central;
        fill: #9CA3AF;
      }

      .white { fill: #FFFFFF; }
      .hazard { fill: #FF3D00; }
      .sep { fill: #FF3D00; font-weight: 900; opacity: 0.9; }

      /* Primary States (Resting 3.2s each) */
      .state-sree {
        animation: fadeSree 8s ease-in-out infinite;
      }

      @keyframes fadeSree {
        0%, 39% { opacity: 1; transform: translateY(0); }
        40.5%, 93.5% { opacity: 0; transform: translateY(-1px); }
        95%, 100% { opacity: 1; transform: translateY(0); }
      }

      .state-lazzer {
        animation: fadeLazzer 8s ease-in-out infinite;
      }

      @keyframes fadeLazzer {
        0%, 44.5% { opacity: 0; transform: translateY(1px); }
        46%, 88% { opacity: 1; transform: translateY(0); }
        89.5%, 100% { opacity: 0; transform: translateY(-1px); }
      }

      /* High-speed Decryption Cipher Sequence 1 (Sree -> Lazzer) */
      .dec-1 { animation: step1 8s infinite; }
      .dec-2 { animation: step2 8s infinite; }
      .dec-3 { animation: step3 8s infinite; }
      .dec-4 { animation: step4 8s infinite; }

      @keyframes step1 {
        0%, 39.5% { opacity: 0; }
        40%, 41.2% { opacity: 1; }
        41.5%, 100% { opacity: 0; }
      }
      @keyframes step2 {
        0%, 41.2% { opacity: 0; }
        41.5%, 42.7% { opacity: 1; }
        43%, 100% { opacity: 0; }
      }
      @keyframes step3 {
        0%, 42.7% { opacity: 0; }
        43%, 44.2% { opacity: 1; }
        44.5%, 100% { opacity: 0; }
      }
      @keyframes step4 {
        0%, 44.2% { opacity: 0; }
        44.5%, 45.7% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }

      /* High-speed Decryption Cipher Sequence 2 (Lazzer -> Sree) */
      .dec-5 { animation: step5 8s infinite; }
      .dec-6 { animation: step6 8s infinite; }
      .dec-7 { animation: step7 8s infinite; }
      .dec-8 { animation: step8 8s infinite; }

      @keyframes step5 {
        0%, 88.5% { opacity: 0; }
        89%, 90.2% { opacity: 1; }
        90.5%, 100% { opacity: 0; }
      }
      @keyframes step6 {
        0%, 90.2% { opacity: 0; }
        90.5%, 91.7% { opacity: 1; }
        92%, 100% { opacity: 0; }
      }
      @keyframes step7 {
        0%, 91.7% { opacity: 0; }
        92%, 93.2% { opacity: 1; }
        93.5%, 100% { opacity: 0; }
      }
      @keyframes step8 {
        0%, 93.2% { opacity: 0; }
        93.5%, 94.7% { opacity: 1; }
        95%, 100% { opacity: 0; }
      }

      /* Smooth RGB Glitch Dispersion */
      .rgb-red {
        fill: #FF0055;
        animation: glitchRed 8s ease-in-out infinite;
      }
      .rgb-cyan {
        fill: #00E676;
        animation: glitchCyan 8s ease-in-out infinite;
      }

      @keyframes glitchRed {
        0%, 39% { opacity: 0; transform: translate(0, 0); }
        39.8% { opacity: 0.8; transform: translate(-5px, 0.5px); }
        41.5% { opacity: 0.6; transform: translate(-2px, -0.5px); }
        43.5% { opacity: 0.9; transform: translate(-6px, 0.5px); }
        45.5% { opacity: 0.4; transform: translate(-1px, 0); }
        46.5%, 88% { opacity: 0; transform: translate(0, 0); }
        88.8% { opacity: 0.8; transform: translate(-5px, -0.5px); }
        90.5% { opacity: 0.6; transform: translate(-2px, 0.5px); }
        92.5% { opacity: 0.9; transform: translate(-6px, -0.5px); }
        94.5% { opacity: 0.4; transform: translate(-1px, 0); }
        95.5%, 100% { opacity: 0; transform: translate(0, 0); }
      }

      @keyframes glitchCyan {
        0%, 39% { opacity: 0; transform: translate(0, 0); }
        39.8% { opacity: 0.8; transform: translate(5px, -0.5px); }
        41.5% { opacity: 0.6; transform: translate(2px, 0.5px); }
        43.5% { opacity: 0.9; transform: translate(6px, -0.5px); }
        45.5% { opacity: 0.4; transform: translate(1px, 0); }
        46.5%, 88% { opacity: 0; transform: translate(0, 0); }
        88.8% { opacity: 0.8; transform: translate(5px, 0.5px); }
        90.5% { opacity: 0.6; transform: translate(2px, -0.5px); }
        92.5% { opacity: 0.9; transform: translate(6px, 0.5px); }
        94.5% { opacity: 0.4; transform: translate(1px, 0); }
        95.5%, 100% { opacity: 0; transform: translate(0, 0); }
      }

      /* Subtitle subtle glow pulse */
      .sub-pulse {
        animation: subGlow 4s ease-in-out infinite;
      }
      @keyframes subGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Clean dark backdrop with soft ambient light-red center glow (NO BORDERS) -->
  <rect width="800" height="240" rx="14" fill="#070303" />
  <rect width="800" height="240" rx="14" fill="url(#redGlow)" />

  <!-- RGB Glitch Layer: RED Chromatic Channel -->
  <g class="rgb-red">
    <text class="headline dec-1" x="400" y="105">5REE DANUSH</text>
    <text class="headline dec-2" x="400" y="105">5R#3 D4NU$H</text>
    <text class="headline dec-3" x="400" y="105">14Z3 D#N*0D</text>
    <text class="headline dec-4" x="400" y="105">14ZZ3R J*0D</text>
    <text class="headline dec-5" x="400" y="105">14ZZ3R J*D</text>
    <text class="headline dec-6" x="400" y="105">14Z# D4NU$H</text>
    <text class="headline dec-7" x="400" y="105">SR33 D4NU5H</text>
    <text class="headline dec-8" x="400" y="105">SREE D4NUSH</text>
  </g>

  <!-- RGB Glitch Layer: CYAN Chromatic Channel -->
  <g class="rgb-cyan">
    <text class="headline dec-1" x="400" y="105">5REE DANUSH</text>
    <text class="headline dec-2" x="400" y="105">5R#3 D4NU$H</text>
    <text class="headline dec-3" x="400" y="105">14Z3 D#N*0D</text>
    <text class="headline dec-4" x="400" y="105">14ZZ3R J*0D</text>
    <text class="headline dec-5" x="400" y="105">14ZZ3R J*D</text>
    <text class="headline dec-6" x="400" y="105">14Z# D4NU$H</text>
    <text class="headline dec-7" x="400" y="105">SR33 D4NU5H</text>
    <text class="headline dec-8" x="400" y="105">SREE D4NUSH</text>
  </g>

  <!-- Fluid High-Speed Character Scramble Sequence -->
  <g filter="url(#bloom)">
    <text class="headline dec-1" x="400" y="105">
      <tspan class="white">5R</tspan><tspan class="hazard">EE DANUSH</tspan>
    </text>
    <text class="headline dec-2" x="400" y="105">
      <tspan class="white">5R#3 </tspan><tspan class="hazard">D4NU$H</tspan>
    </text>
    <text class="headline dec-3" x="400" y="105">
      <tspan class="hazard">14Z3 </tspan><tspan class="white">D#N*0D</tspan>
    </text>
    <text class="headline dec-4" x="400" y="105">
      <tspan class="hazard">14ZZ3R </tspan><tspan class="white">J*0D</tspan>
    </text>

    <text class="headline dec-5" x="400" y="105">
      <tspan class="hazard">14ZZ3R </tspan><tspan class="white">J*D</tspan>
    </text>
    <text class="headline dec-6" x="400" y="105">
      <tspan class="hazard">14Z# </tspan><tspan class="white">D4NU$H</tspan>
    </text>
    <text class="headline dec-7" x="400" y="105">
      <tspan class="white">SR33 </tspan><tspan class="hazard">D4NU5H</tspan>
    </text>
    <text class="headline dec-8" x="400" y="105">
      <tspan class="white">SREE </tspan><tspan class="hazard">D4NUSH</tspan>
    </text>
  </g>

  <!-- SOLID STATE 1: SREE DANUSH (Holds 3.2s) -->
  <g class="state-sree" filter="url(#bloom)">
    <text class="headline" x="400" y="105">
      <tspan class="white">SREE </tspan><tspan class="hazard">DANUSH</tspan>
    </text>
  </g>

  <!-- SOLID STATE 2: L4ZZ3RJ0D (Holds 3.2s) -->
  <g class="state-lazzer" filter="url(#bloom)">
    <text class="headline" x="400" y="105">
      <tspan class="hazard">L4ZZ3R</tspan><tspan class="white">J0D</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g class="sub-pulse">
    <text class="subtitle" x="400" y="168">
      SECURITY RESEARCHER <tspan class="sep">|</tspan> TOOL BUILDER <tspan class="sep">|</tspan> BUG HUNTER
    </text>
  </g>
</svg>
