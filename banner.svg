<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <!-- Deep Atmospheric Dark Red Background -->
    <radialGradient id="darkRedBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a0508" stop-opacity="1" />
      <stop offset="45%" stop-color="#140305" stop-opacity="1" />
      <stop offset="100%" stop-color="#0a0507" stop-opacity="1" />
    </radialGradient>

    <!-- Vibrant Crimson Ambient Light Aura -->
    <radialGradient id="crimsonAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#CC0000" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0a0507" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Bloom Filter for Luminous Headline -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&amp;display=swap');

      /* Base Typography */
      .headline {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        font-size: 66px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .subtitle {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-anchor: middle;
        dominant-baseline: central;
        fill: #dcc7c7;
      }

      .white { fill: #FFFFFF; }
      .hazard { fill: #ff3b3b; }
      .sep { fill: #cc0000; font-weight: 900; }

      /* =========================================================
         ULTRA-SMOOTH CINEMATIC MORPH TIMELINE (7s Total Loop)
         ========================================================= */

      /* Identity 1: SREE DANUSH */
      .state-sree {
        animation: morphSree 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes morphSree {
        0%, 41.5% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
        42.5% {
          opacity: 0.6;
          transform: translateY(-1px) scale(0.995);
          filter: blur(1px);
        }
        43.5%, 95.5% {
          opacity: 0;
          transform: translateY(-2px) scale(0.99);
          filter: blur(2px);
        }
        96.5% {
          opacity: 0.6;
          transform: translateY(1px) scale(0.995);
          filter: blur(1px);
        }
        97.5%, 100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }

      /* Identity 2: L4ZZ3RJ0D */
      .state-lazzer {
        animation: morphLazzer 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes morphLazzer {
        0%, 43.5% {
          opacity: 0;
          transform: translateY(2px) scale(0.99);
          filter: blur(2px);
        }
        44.5% {
          opacity: 0.6;
          transform: translateY(1px) scale(0.995);
          filter: blur(1px);
        }
        45.5%, 91.5% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
        92.5% {
          opacity: 0.6;
          transform: translateY(-1px) scale(0.995);
          filter: blur(1px);
        }
        93.5%, 100% {
          opacity: 0;
          transform: translateY(-2px) scale(0.99);
          filter: blur(2px);
        }
      }

      /* =========================================================
         HIGH-FRAMERATE PROGRESSIVE SCRAMBLE CIPHER
         ========================================================= */
      .cipher-a { animation: streamA 7s infinite; }
      .cipher-b { animation: streamB 7s infinite; }
      .cipher-c { animation: streamC 7s infinite; }
      .cipher-d { animation: streamD 7s infinite; }

      @keyframes streamA {
        0%, 41.5% { opacity: 0; }
        42%, 42.8% { opacity: 0.95; }
        43.2%, 100% { opacity: 0; }
      }
      @keyframes streamB {
        0%, 42.8% { opacity: 0; }
        43.2%, 44% { opacity: 0.95; }
        44.5%, 100% { opacity: 0; }
      }
      @keyframes streamC {
        0%, 92% { opacity: 0; }
        92.5%, 93.5% { opacity: 0.95; }
        94%, 100% { opacity: 0; }
      }
      @keyframes streamD {
        0%, 93.5% { opacity: 0; }
        94%, 95.2% { opacity: 0.95; }
        95.7%, 100% { opacity: 0; }
      }

      /* =========================================================
         ANALOG RGB CHROMATIC ABERRATION JITTER
         ========================================================= */
      .rgb-red {
        fill: #cc0000;
        animation: jitterRed 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .rgb-cyan {
        fill: #ff9a9a;
        animation: jitterCyan 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      @keyframes jitterRed {
        0%, 41% { opacity: 0; transform: translate(0, 0); }
        41.8% { opacity: 0.75; transform: translate(-4px, 0.5px); }
        42.6% { opacity: 0.9; transform: translate(-2px, -0.5px); }
        43.4% { opacity: 0.7; transform: translate(-5px, 0); }
        44.2% { opacity: 0.4; transform: translate(-1px, 0.5px); }
        45%, 91% { opacity: 0; transform: translate(0, 0); }
        91.8% { opacity: 0.75; transform: translate(-4px, -0.5px); }
        92.6% { opacity: 0.9; transform: translate(-2px, 0.5px); }
        93.4% { opacity: 0.7; transform: translate(-5px, 0); }
        94.2% { opacity: 0.4; transform: translate(-1px, -0.5px); }
        95%, 100% { opacity: 0; transform: translate(0, 0); }
      }

      @keyframes jitterCyan {
        0%, 41% { opacity: 0; transform: translate(0, 0); }
        41.8% { opacity: 0.75; transform: translate(4px, -0.5px); }
        42.6% { opacity: 0.9; transform: translate(2px, 0.5px); }
        43.4% { opacity: 0.7; transform: translate(5px, 0); }
        44.2% { opacity: 0.4; transform: translate(1px, -0.5px); }
        45%, 91% { opacity: 0; transform: translate(0, 0); }
        91.8% { opacity: 0.75; transform: translate(4px, 0.5px); }
        92.6% { opacity: 0.9; transform: translate(2px, -0.5px); }
        93.4% { opacity: 0.7; transform: translate(5px, 0); }
        94.2% { opacity: 0.4; transform: translate(1px, 0.5px); }
        95%, 100% { opacity: 0; transform: translate(0, 0); }
      }

      /* Subtle breathing pulse on the subtitle */
      .sub-glow {
        animation: subPulse 4s ease-in-out infinite;
      }
      @keyframes subPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Deep Dark Red Background matching all-red GitHub README (NO BORDERS) -->
  <rect width="800" height="240" rx="14" fill="url(#darkRedBg)" />
  <rect width="800" height="240" rx="14" fill="url(#crimsonAura)" />

  <!-- RGB Glitch Layer: RED Chromatic Channel Shift -->
  <g class="rgb-red">
    <text class="headline cipher-a" x="400" y="105">5REE D4NUSH</text>
    <text class="headline cipher-b" x="400" y="105">14ZZ3R J0%</text>
    <text class="headline cipher-c" x="400" y="105">14ZZ3R J*D</text>
    <text class="headline cipher-d" x="400" y="105">SR33 D4NU5H</text>
  </g>

  <!-- RGB Glitch Layer: CYAN/GREEN Chromatic Channel Shift -->
  <g class="rgb-cyan">
    <text class="headline cipher-a" x="400" y="105">5REE D4NUSH</text>
    <text class="headline cipher-b" x="400" y="105">14ZZ3R J0%</text>
    <text class="headline cipher-c" x="400" y="105">14ZZ3R J*D</text>
    <text class="headline cipher-d" x="400" y="105">SR33 D4NU5H</text>
  </g>

  <!-- Rapid Cyber Scramble Decryption Streams -->
  <g filter="url(#bloom)">
    <text class="headline cipher-a" x="400" y="105">
      <tspan class="white">5R</tspan><tspan class="hazard">33 D4NU$H</tspan>
    </text>
    <text class="headline cipher-b" x="400" y="105">
      <tspan class="hazard">14ZZ</tspan><tspan class="white">3R J0%</tspan>
    </text>
    <text class="headline cipher-c" x="400" y="105">
      <tspan class="hazard">L4Z!</tspan><tspan class="white">3R J*D</tspan>
    </text>
    <text class="headline cipher-d" x="400" y="105">
      <tspan class="white">SR33 </tspan><tspan class="hazard">D4NU5H</tspan>
    </text>
  </g>

  <!-- SOLID STATE 1: SREE DANUSH (Smooth Cubic Fade) -->
  <g class="state-sree" filter="url(#bloom)">
    <text class="headline" x="400" y="105">
      <tspan class="white">SREE </tspan><tspan class="hazard">DANUSH</tspan>
    </text>
  </g>

  <!-- SOLID STATE 2: L4ZZ3RJ0D (Smooth Cubic Fade) -->
  <g class="state-lazzer" filter="url(#bloom)">
    <text class="headline" x="400" y="105">
      <tspan class="hazard">L4ZZ3R</tspan><tspan class="white">J0D</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline (Security researcher | tool builder | bug hunter) -->
  <g class="sub-glow">
    <text class="subtitle" x="400" y="168">
      SECURITY RESEARCHER <tspan class="sep">|</tspan> TOOL BUILDER <tspan class="sep">|</tspan> BUG HUNTER
    </text>
  </g>
</svg>
