<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <!-- Soft light-red ambient background glow (matches portfolio textShadow aura) -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FF3D00" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#FF1E00" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0A0404" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800;900&amp;display=swap');

      .main-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        font-size: 68px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .white { fill: #FFFFFF; }
      .hazard { fill: #FF3D00; }

      /* State 1: SREE DANUSH */
      .state-sree {
        animation: animSree 6s infinite;
      }

      @keyframes animSree {
        0%, 42% { opacity: 1; visibility: visible; }
        43%, 95% { opacity: 0; visibility: hidden; }
        96%, 100% { opacity: 1; visibility: visible; }
      }

      /* State 2: L4ZZ3RJ0D */
      .state-lazzer {
        animation: animLazzer 6s infinite;
      }

      @keyframes animLazzer {
        0%, 47% { opacity: 0; visibility: hidden; }
        48%, 91% { opacity: 1; visibility: visible; }
        92%, 100% { opacity: 0; visibility: hidden; }
      }

      /* Rapid Scramble Cipher Stages */
      .scramble-1 {
        animation: animScramble1 6s infinite;
      }
      @keyframes animScramble1 {
        0%, 42% { opacity: 0; }
        42.5%, 44.5% { opacity: 1; }
        45%, 100% { opacity: 0; }
      }

      .scramble-2 {
        animation: animScramble2 6s infinite;
      }
      @keyframes animScramble2 {
        0%, 44.5% { opacity: 0; }
        45%, 47.5% { opacity: 1; }
        48%, 100% { opacity: 0; }
      }

      .scramble-3 {
        animation: animScramble3 6s infinite;
      }
      @keyframes animScramble3 {
        0%, 91% { opacity: 0; }
        91.5%, 93.5% { opacity: 1; }
        94%, 100% { opacity: 0; }
      }

      .scramble-4 {
        animation: animScramble4 6s infinite;
      }
      @keyframes animScramble4 {
        0%, 93.5% { opacity: 0; }
        94%, 95.5% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      /* RGB Chromatic Split during Glitch */
      .rgb-red {
        fill: #FF0055;
        opacity: 0.85;
        animation: animRgbRed 6s infinite;
      }
      .rgb-cyan {
        fill: #00E676;
        opacity: 0.85;
        animation: animRgbCyan 6s infinite;
      }

      @keyframes animRgbRed {
        0%, 41.5% { opacity: 0; transform: translate(0, 0); }
        42%, 47.5% { opacity: 0.85; transform: translate(-4px, -1px); }
        48%, 90.5% { opacity: 0; transform: translate(0, 0); }
        91%, 95.5% { opacity: 0.85; transform: translate(-5px, 1px); }
        96%, 100% { opacity: 0; transform: translate(0, 0); }
      }

      @keyframes animRgbCyan {
        0%, 41.5% { opacity: 0; transform: translate(0, 0); }
        42%, 47.5% { opacity: 0.85; transform: translate(4px, 1px); }
        48%, 90.5% { opacity: 0; transform: translate(0, 0); }
        91%, 95.5% { opacity: 0.85; transform: translate(5px, -1px); }
        96%, 100% { opacity: 0; transform: translate(0, 0); }
      }
    </style>
  </defs>

  <!-- Clean dark background with light-red ambient glow in center (NO BORDERS) -->
  <rect width="800" height="220" rx="12" fill="#0A0404" />
  <rect width="800" height="220" rx="12" fill="url(#redGlow)" />

  <!-- RGB Glitch Layer: RED Channel Shift -->
  <g class="rgb-red">
    <text class="main-text scramble-1" x="400" y="110">5R33 D4N#$H</text>
    <text class="main-text scramble-2" x="400" y="110">14ZZ*R J0%</text>
    <text class="main-text scramble-3" x="400" y="110">L4Z!3R J*D</text>
    <text class="main-text scramble-4" x="400" y="110">SR*3 D4NU$H</text>
  </g>

  <!-- RGB Glitch Layer: CYAN/GREEN Channel Shift -->
  <g class="rgb-cyan">
    <text class="main-text scramble-1" x="400" y="110">5R33 D4N#$H</text>
    <text class="main-text scramble-2" x="400" y="110">14ZZ*R J0%</text>
    <text class="main-text scramble-3" x="400" y="110">L4Z!3R J*D</text>
    <text class="main-text scramble-4" x="400" y="110">SR*3 D4NU$H</text>
  </g>

  <!-- Mid-Glitch Character Scramble Decryption States -->
  <g filter="url(#textGlow)">
    <text class="main-text scramble-1" x="400" y="110">
      <tspan class="white">5R</tspan><tspan class="hazard">33 </tspan><tspan class="hazard">D4N#$H</tspan>
    </text>
    <text class="main-text scramble-2" x="400" y="110">
      <tspan class="hazard">14ZZ*</tspan><tspan class="white">R J0%</tspan>
    </text>
    <text class="main-text scramble-3" x="400" y="110">
      <tspan class="hazard">L4Z!</tspan><tspan class="white">3R J*D</tspan>
    </text>
    <text class="main-text scramble-4" x="400" y="110">
      <tspan class="white">SR*3 </tspan><tspan class="hazard">D4NU$H</tspan>
    </text>
  </g>

  <!-- RESOLVED STATE 1: SREE DANUSH -->
  <g class="state-sree" filter="url(#textGlow)">
    <text class="main-text" x="400" y="110">
      <tspan class="white">SREE </tspan><tspan class="hazard">DANUSH</tspan>
    </text>
  </g>

  <!-- RESOLVED STATE 2: L4ZZ3RJ0D -->
  <g class="state-lazzer" filter="url(#textGlow)">
    <text class="main-text" x="400" y="110">
      <tspan class="hazard">L4ZZ3R</tspan><tspan class="white">J0D</tspan>
    </text>
  </g>
</svg>
