<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A glowing padlock opening: open to web pentesting, OSINT and AI/LLM work" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="card"><rect x="8" y="8" width="384" height="384" rx="18"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="384" height="384" rx="18" fill="#0a0507" stroke="#3a0a0a" stroke-width="2"/>
  <g clip-path="url(#card)" font-family="Courier New, monospace">
    <circle cx="200" cy="215" r="150" fill="url(#aura)">
      <animate attributeName="opacity" values=".35;.9;.35" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#ff3b3b" stroke-width="1.5" opacity="0">
      <line x1="200" y1="215" x2="200" y2="60"/>
      <line x1="200" y1="215" x2="95"  y2="100"/>
      <line x1="200" y1="215" x2="305" y2="100"/>
      <line x1="200" y1="215" x2="60"  y2="215"/>
      <line x1="200" y1="215" x2="340" y2="215"/>
      <animate attributeName="opacity" values="0;0;.5;.5;0;0" keyTimes="0;.3;.42;.7;.82;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <g fill="#ff6666" opacity=".7">
      <circle cx="70"  cy="320" r="2"><animate attributeName="cy" from="330" to="60" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="340" r="1.6"><animate attributeName="cy" from="350" to="80" dur="9s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="335" r="2"><animate attributeName="cy" from="345" to="70" dur="8s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="335" cy="325" r="1.6"><animate attributeName="cy" from="335" to="90" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
    </g>

    <g filter="url(#glow)" fill="none" stroke="#ff3b3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M158 200 V160 a42 42 0 0 1 84 0 V200">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 -26; 0 -26; 0 0; 0 0" keyTimes="0;.25;.4;.7;.82;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <rect x="128" y="200" width="144" height="108" rx="14" fill="#160406"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="200" cy="246" r="11" fill="#ff3b3b">
        <animate attributeName="fill" values="#ff3b3b;#ff3b3b;#ffd0d0;#ffd0d0;#ff3b3b;#ff3b3b" keyTimes="0;.25;.4;.7;.82;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <path d="M200 252 L192 280 H208 Z" fill="#ff3b3b"/>
    </g>

    <text x="200" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#ff3b3b" letter-spacing="8" filter="url(#glow)">OPEN TO</text>
    <g font-size="14" font-weight="bold" fill="#ff8a8a" text-anchor="middle" letter-spacing="3">
      <text x="200" y="345">WEB PENTESTING</text>
      <text x="200" y="368">OSINT · AI / LLM</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
