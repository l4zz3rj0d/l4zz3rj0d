<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A scanner sweeping a web page and flagging XSS, IDOR and SSRF" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="card"><rect x="8" y="8" width="384" height="384" rx="18"/></clipPath>
    <clipPath id="win"><rect x="40" y="82" width="320" height="262" rx="10"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="384" height="384" rx="18" fill="#0a0507" stroke="#3a0a0a" stroke-width="2"/>
  <g clip-path="url(#card)" font-family="Courier New, monospace">
    <text x="200" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#ff3b3b" letter-spacing="8" filter="url(#glow)">HUNTING</text>

    <rect x="40" y="82" width="320" height="262" rx="10" fill="#120609" stroke="#8b0000" stroke-width="2"/>
    <rect x="40" y="82" width="320" height="26" rx="10" fill="#1d080c"/>
    <circle cx="58" cy="95" r="4" fill="#cc0000"/><circle cx="73" cy="95" r="4" fill="#8b0000"/><circle cx="88" cy="95" r="4" fill="#5a0a0a"/>
    <rect x="110" y="88" width="230" height="14" rx="7" fill="#0a0507" stroke="#5a0a0a"/>
    <text x="122" y="99" font-size="9" fill="#ff6666">https://target.app/</text>

    <g clip-path="url(#win)" fill="#2a0c10">
      <rect x="58" y="124" width="140" height="14" rx="3"/>
      <rect x="58" y="150" width="284" height="8" rx="3"/>
      <rect x="58" y="166" width="250" height="8" rx="3"/>
      <rect x="58" y="188" width="130" height="70" rx="5"/>
      <rect x="204" y="188" width="138" height="30" rx="5"/>
      <rect x="204" y="228" width="138" height="30" rx="5"/>
      <rect x="58" y="274" width="180" height="22" rx="5"/>
      <rect x="248" y="274" width="94" height="22" rx="5" fill="#4a1015"/>
      <rect x="58" y="310" width="284" height="8" rx="3"/>

      <g fill="none" stroke="#ff3b3b" stroke-width="2" filter="url(#glow)">
        <rect x="56" y="186" width="134" height="74" rx="5" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.26;.3;.88;.94;1" dur="6s" repeatCount="indefinite"/>
        </rect>
        <rect x="202" y="186" width="142" height="34" rx="5" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.45;.49;.88;.94;1" dur="6s" repeatCount="indefinite"/>
        </rect>
        <rect x="246" y="272" width="98" height="26" rx="5" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.66;.7;.88;.94;1" dur="6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <rect x="40" y="0" width="320" height="46" fill="url(#beam)">
        <animate attributeName="y" values="70;300;300" keyTimes="0;.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="0" width="320" height="2" fill="#ff8a8a" filter="url(#glow)">
        <animate attributeName="y" values="114;344;344" keyTimes="0;.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-size="11" font-weight="bold" text-anchor="middle" fill="#0a0507">
      <g opacity="0" filter="url(#glow)">
        <rect x="102" y="214" width="46" height="18" rx="4" fill="#ff3b3b"/><text x="125" y="227">XSS</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.28;.32;.88;.94;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <g opacity="0" filter="url(#glow)">
        <rect x="262" y="194" width="46" height="18" rx="4" fill="#ff3b3b"/><text x="285" y="207">IDOR</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.47;.51;.88;.94;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <g opacity="0" filter="url(#glow)">
        <rect x="270" y="276" width="46" height="18" rx="4" fill="#ff3b3b"/><text x="293" y="289">SSRF</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.68;.72;.88;.94;1" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="200" y="375" text-anchor="middle" font-size="12" fill="#ff6666" letter-spacing="3">FUZZING<tspan>...<animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
