<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Hooded figure with glowing red eyes" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#220707"/>
      <stop offset="1" stop-color="#060000"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="card"><rect x="8" y="8" width="384" height="384" rx="18"/></clipPath>
  </defs>
  <rect x="8" y="8" width="384" height="384" rx="18" fill="#0d1117" stroke="#3a0a0a" stroke-width="2"/>
  <g clip-path="url(#card)" font-family="Courier New, monospace" font-size="13" fill="#8b0000">
    <rect width="400" height="400" fill="url(#glow)">
      <animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="38"  y="-10" opacity=".45">01<animate attributeName="y" from="-10" to="420" dur="7s"  repeatCount="indefinite"/></text>
    <text x="92"  y="-10" opacity=".35">{ }<animate attributeName="y" from="-10" to="420" dur="9s"  begin="-3s" repeatCount="indefinite"/></text>
    <text x="150" y="-10" opacity=".4">&lt;/&gt;<animate attributeName="y" from="-10" to="420" dur="6s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="250" y="-10" opacity=".4">10<animate attributeName="y" from="-10" to="420" dur="8s"  begin="-5s" repeatCount="indefinite"/></text>
    <text x="305" y="-10" opacity=".35">0x<animate attributeName="y" from="-10" to="420" dur="10s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="352" y="-10" opacity=".45">&amp;&amp;<animate attributeName="y" from="-10" to="420" dur="7.5s" begin="-4s" repeatCount="indefinite"/></text>

    <circle cx="200" cy="205" r="150" fill="none" stroke="#5a0a0a" stroke-width="1.5" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 200 205" to="360 200 205" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="205" r="120" fill="none" stroke="#3a0a0a" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360 200 205" to="0 200 205" dur="30s" repeatCount="indefinite"/>
    </circle>

    <path d="M60 392 C60 330 110 290 165 266 L235 266 C290 290 340 330 340 392 Z" fill="url(#cloak)" stroke="#5a0a0a" stroke-width="1.5"/>
    <path d="M135 215 C130 140 160 95 200 95 C240 95 270 140 265 215 C265 238 250 252 235 258 L165 258 C150 252 135 238 135 215 Z" fill="url(#cloak)" stroke="#8b0000" stroke-width="2"/>
    <ellipse cx="200" cy="192" rx="48" ry="54" fill="#000"/>

    <ellipse cx="180" cy="188" rx="9" ry="6" fill="#ff3b3b" filter="url(#blur)" opacity=".8"/>
    <ellipse cx="220" cy="188" rx="9" ry="6" fill="#ff3b3b" filter="url(#blur)" opacity=".8"/>
    <ellipse cx="180" cy="188" rx="7" ry="5" fill="#ff3b3b">
      <animate attributeName="ry" values="5;5;5;.5;5" keyTimes="0;.9;.94;.97;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="220" cy="188" rx="7" ry="5" fill="#ff3b3b">
      <animate attributeName="ry" values="5;5;5;.5;5" keyTimes="0;.9;.94;.97;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="0" y="0" width="400" height="3" fill="#ff3b3b" opacity=".12">
      <animate attributeName="y" from="0" to="400" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="200" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#ff3b3b" letter-spacing="3">&gt; L4ZZ3RJ0D<tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
